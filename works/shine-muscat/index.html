<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7fb">
<title>シャインマスカット兄弟メーカー</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f7fb;--text:#222;--muted:#687083;--accent:#5f6fff;--soft:#eef0ff}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,rgba(95,111,255,.12),transparent 32rem),var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}.wrap{width:min(960px,92%);margin:0 auto}.top{padding:22px 0}
.back{display:inline-flex;gap:8px;align-items:center;color:var(--muted);padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.75)}
.hero{text-align:center;padding:54px 0 42px}.icon{width:72px;height:72px;margin:0 auto 20px;display:grid;place-items:center;border-radius:22px;background:var(--soft);font-size:2.2rem}
h1{margin:0;font-size:clamp(2rem,7vw,3.7rem);letter-spacing:-.035em}.hero p{max-width:670px;margin:18px auto 0;color:var(--muted);line-height:1.8}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px 0 70px}.mode{background:#fff;border-radius:22px;padding:28px;min-height:260px;box-shadow:0 12px 34px rgba(30,38,80,.08);display:flex;flex-direction:column;justify-content:space-between;transition:.18s ease}
.mode:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(30,38,80,.12)}.mode-emoji{font-size:2rem}.mode h2{margin:24px 0 9px;font-size:1.45rem}.mode p{margin:0;color:var(--muted);line-height:1.7}.go{margin-top:28px;display:flex;justify-content:space-between;color:#4d5de9;font-weight:800}
@media(max-width:680px){.hero{padding:36px 0 28px}.modes{grid-template-columns:1fr;gap:14px;padding-bottom:40px}.mode{min-height:220px;padding:22px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="back" href="../../">← 工作置き場へ戻る</a></div>
<main>
<section class="hero"><div class="icon">🍇</div><h1>シャインマスカット<br>兄弟メーカー</h1><p>「シャイン」に近い言葉と「マスカット」に近い言葉を組み合わせて、シャインマスカットの兄弟らしき何かを生み出します。</p></section>
<section class="modes">
<a class="mode" href="./shuffle.html"><div><div class="mode-emoji">🎲</div><h2>ランダム生成</h2><p>上の句と下の句から1つずつランダムに選んで、一発で兄弟を生成します。</p></div><div class="go"><span>シャッフルする</span><span>→</span></div></a>
<a class="mode" href="./cards.html"><div><div class="mode-emoji">🃏</div><h2>カード選択</h2><p>上の句と下の句をカードから自分で選び、納得のいく兄弟を錬成します。</p></div><div class="go"><span>自分で選ぶ</span><span>→</span></div></a>
</section>
</main>
</div>
</body></html>
